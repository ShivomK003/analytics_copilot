name: Daily ETL

on:
  Schedule temporarily disabled until controlled ETL testing is complete.
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

concurrency:
  group: daily-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run ETL pipeline
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: uv run --no-sync python -m etl.run_pipeline

      - name: Upload ETL quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: data/reports/quality_report.json
          if-no-files-found: warn

      - name: Upload ETL logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-log
          path: logs/etl.log
          if-no-files-found: warn
